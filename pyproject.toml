[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-egress"
version = "0.1.0"
description = "A small, policy-driven Python HTTP fetcher with destination checks at connect time"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
safe-egress-audit = "safe_egress.audit:main"

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]
requests = ["requests>=2.31,<3"]
httpx = ["httpx>=0.27,<1"]
aiohttp = ["aiohttp>=3.9,<4"]
urllib3 = ["urllib3>=2,<3"]
curl-cffi = ["curl-cffi==0.15.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
